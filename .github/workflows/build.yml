name: Bygg kortleken

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # A pull request is only checked; ids are handed out once it is merged,
      # so two open pull requests can never be given the same one.
      - name: Kontrollera korten
        if: github.event_name == 'pull_request'
        run: python tools/build.py --check --summary "$GITHUB_STEP_SUMMARY"

      - name: Ge nya kort ett id
        if: github.event_name != 'pull_request'
        run: |
          python tools/build.py --assign-ids
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Id för nya kort"
            git push
          fi

      - name: Bygg .apkg
        if: github.event_name != 'pull_request'
        run: |
          python tools/build.py --summary dist/summary.md
          cat dist/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicera release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%Y-%m-%d)
          gh release create "v$day-${{ github.run_number }}" dist/liu-kort.apkg \
            --title "Kortleken $day" --notes-file dist/summary.md --latest
